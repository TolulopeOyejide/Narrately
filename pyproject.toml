[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrately"
version = "1.0.0"
description = "Narrately — AI image captioning using BLIP. Local files, image URLs, and full webpages."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tolulope Oyejide" }]
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "Pillow>=10.4",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
]

[project.scripts]
narrately = "narrately.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
